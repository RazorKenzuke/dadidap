<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karhutla</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="kotak">
        <h2>Form Pendaftaran Relawan Karhutla</h2>
        <form action="2ndpage.html">
            <label>Nama lengkap: </label>"><br>
            <input type="text" name="nama" required><br>

            <label>Email: </label><br>
            <input type="email" name = "email" required><br>

            <label> Tanggal Lahir: </label><br>
            <input type="date" name="tgl_lahir"><br><br>

            <label>Jenis kelamin: </label><br>
            <input type="radio" name="jk" value="Laki-laki"> Laki-laki
            <input type="radio" name="jk" value="Perempuan"> Perempuan <br><br>

            <label>Wilayah Pilihan: </label><br>
            <select name="pilihan">
                <option value="Kalimantan Barat">Kalimantan Barat</option>
                <option value="Kalimantan Timur">Kalimantan Timur</option>
                <option value="Kalimantan Tengah">Kalimantan Tengah</option>
            </select><br><br>


        </form>
    </div>
</body>
</html>
